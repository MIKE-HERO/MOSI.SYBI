<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videollamada MOSI</title>
    <!--
        Motor de video de la consulta de telemedicina.
        Solo maneja audio/video con apiRTC; toda la interfaz y el flujo con el servidor
        viven en TelemedicineActivity. Se comunica con Kotlin a través de window.MosiBridge.
    -->
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #remote {
            position: absolute;
            inset: 0;
        }

        #remote video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #local {
            position: absolute;
            top: 80px;
            right: 16px;
            width: 22%;
            max-width: 320px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            background: #222;
            transform: scaleX(-1);
        }

        /* Respaldo WebRTC: se muestra encima del video de apiRTC, que sigue de fondo */
        #fallback {
            position: absolute;
            inset: 0;
            display: none;
            background: #000;
        }

        #fallback.activo {
            display: block;
        }

        #fb-remote {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #fb-local {
            position: absolute;
            top: 80px;
            right: 16px;
            width: 22%;
            max-width: 320px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            background: #222;
            transform: scaleX(-1);
        }
    </style>
    <script>
        // Si el SDK de apiRTC ni siquiera se puede interpretar (WebView viejo) queda aquí el motivo
        window.__errorSdk = '';
        window.addEventListener('error', (e) => {
            if (e.filename && e.filename.indexOf('apiRTC') >= 0) window.__errorSdk = String(e.message || '');
        });

        function emit(tipo, datos) {
            try {
                window.MosiBridge.onEvent(tipo, JSON.stringify(datos || {}));
            } catch (e) {
                console.error('MosiBridge no disponible', e);
            }
        }

        // apiRTC a veces rechaza con objetos ({ error: Error }, { message }, ...) en lugar de Error
        function describirError(err) {
            let actual = err;
            while (actual && typeof actual === 'object' && !(actual instanceof Error) && actual.error) {
                actual = actual.error;
            }
            let mensaje = actual && (actual.message || actual.reason);
            if (!mensaje) {
                try {
                    mensaje = typeof actual === 'string' ? actual : JSON.stringify(actual);
                } catch (e) {
                    mensaje = String(actual);
                }
            }
            return {
                nombre: (actual && actual.name) || '',
                mensaje: String(mensaje)
            };
        }
    </script>
    <script>
        /*
         * SDK de apiRTC. La versión actual usa sintaxis moderna de JavaScript (p. ej. "?.") que un
         * WebView anterior a Chrome 80 no puede interpretar. En esos equipos se carga una copia del
         * mismo SDK convertida para navegadores viejos (compat/) junto con polyfills, así la app no
         * depende de que cada equipo tenga el WebView actualizado. En WebViews modernos se usa el
         * SDK oficial de la CDN, igual que la web.
         */
        window.__chromeVersion = parseInt((navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1], 10) || 0;
        window.__modoCompat = window.__chromeVersion > 0 && window.__chromeVersion < 80;

        function cargarScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('No se pudo cargar ' + src));
                document.head.appendChild(s);
            });
        }

        window.__sdkListo = (window.__modoCompat
            ? cargarScript('compat/corejs.min.js').then(() => cargarScript('compat/apiRTC-compat.min.js'))
            : cargarScript('https://cdn.apirtc.com/apiRTC/apiRTC-latest.min.js'))
            .catch((err) => emit('error', { etapa: 'sdk', mensaje: String(err.message || err) }));
    </script>
</head>
<body>
    <div id="remote"></div>
    <video id="local" autoplay muted playsinline></video>
    <canvas id="puenteCamara" style="display:none"></canvas>
    <div id="fallback">
        <video id="fb-remote" autoplay playsinline></video>
        <video id="fb-local" autoplay muted playsinline></video>
    </div>
    <script src="socket.io.min.js"></script>

    <script>
        const MosiCall = (() => {
            let userAgent = null;
            let conversation = null;
            let localStream = null;
            let camaras = [];
            let indiceCamara = 0;

            // Puente de cámara externa: Kotlin captura con Camera2 (evita un bug conocido de
            // getUserMedia del WebView con cámaras del HAL externo/USB) y empuja frames JPEG aquí,
            // que se dibujan en este canvas para armar el video con canvas.captureStream().
            let canvasPuente = null;
            let ctxPuente = null;
            let huboFramePuente = false;
            let resolverPrimerFramePuente = null;

            function pushFrame(base64Jpeg) {
                if (!canvasPuente) return;
                const img = new Image();
                img.onload = () => {
                    if (!canvasPuente) return;
                    ctxPuente.drawImage(img, 0, 0, canvasPuente.width, canvasPuente.height);
                    if (!huboFramePuente) {
                        huboFramePuente = true;
                        if (resolverPrimerFramePuente) resolverPrimerFramePuente();
                    }
                };
                img.src = 'data:image/jpeg;base64,' + base64Jpeg;
            }

            function abrirCamaraPuente(ancho, alto, timeoutMs) {
                canvasPuente = document.getElementById('puenteCamara');
                canvasPuente.width = ancho;
                canvasPuente.height = alto;
                ctxPuente = canvasPuente.getContext('2d');
                huboFramePuente = false;
                const espera = new Promise((resolve) => { resolverPrimerFramePuente = resolve; });
                return etapa('camara', espera, timeoutMs).then(() => canvasPuente.captureStream(12));
            }

            // Puente de micrófono: mismo motivo que el de cámara. getUserMedia({audio:true}) se
            // cuelga en este WebView sin resolver ni rechazar (onPermissionRequest nunca llega a
            // invocarse). AudioRecord nativo entrega PCM de 16 bits aquí, que se reproduce en un
            // grafo de Web Audio (ScriptProcessorNode) hacia un MediaStreamAudioDestinationNode
            // para obtener un MediaStreamTrack de audio real sin pasar por getUserMedia.
            let audioCtxPuente = null;
            let audioQueuePuente = [];
            let huboFrameAudioPuente = false;
            let resolverPrimerFrameAudioPuente = null;

            function pushAudioFrame(base64Pcm16) {
                if (!audioCtxPuente) return;
                const raw = atob(base64Pcm16);
                const n = raw.length >> 1;
                const floats = new Float32Array(n);
                for (let i = 0; i < n; i++) {
                    let s = raw.charCodeAt(i * 2) | (raw.charCodeAt(i * 2 + 1) << 8);
                    if (s >= 0x8000) s -= 0x10000;
                    floats[i] = s / 32768;
                }
                audioQueuePuente.push(floats);
                if (!huboFrameAudioPuente) {
                    huboFrameAudioPuente = true;
                    if (resolverPrimerFrameAudioPuente) resolverPrimerFrameAudioPuente();
                }
            }

            function abrirMicrofonoPuente(timeoutMs) {
                const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
                audioCtxPuente = new AudioContextCtor({ sampleRate: 16000 });
                audioQueuePuente = [];
                huboFrameAudioPuente = false;

                const destino = audioCtxPuente.createMediaStreamDestination();
                const proceso = audioCtxPuente.createScriptProcessor(2048, 0, 1);
                let sobrante = null;
                proceso.onaudioprocess = (evento) => {
                    const salida = evento.outputBuffer.getChannelData(0);
                    let listos = 0;
                    if (sobrante) {
                        const tomar = Math.min(sobrante.length, salida.length);
                        salida.set(sobrante.subarray(0, tomar), 0);
                        listos = tomar;
                        sobrante = tomar < sobrante.length ? sobrante.subarray(tomar) : null;
                    }
                    while (listos < salida.length && audioQueuePuente.length > 0) {
                        const bloque = audioQueuePuente.shift();
                        const faltan = salida.length - listos;
                        if (bloque.length <= faltan) {
                            salida.set(bloque, listos);
                            listos += bloque.length;
                        } else {
                            salida.set(bloque.subarray(0, faltan), listos);
                            sobrante = bloque.subarray(faltan);
                            listos += faltan;
                        }
                    }
                    if (listos < salida.length) salida.fill(0, listos); // sin datos: silencio, no ruido
                };
                // Conectado también hacia destination (con ganancia 0): algunos navegadores dejan de
                // llamar a onaudioprocess si el nodo no llega a ninguna salida real del contexto.
                const silencio = audioCtxPuente.createGain();
                silencio.gain.value = 0;
                proceso.connect(silencio);
                silencio.connect(audioCtxPuente.destination);
                proceso.connect(destino);

                audioCtxPuente.resume().catch(() => { });

                const espera = new Promise((resolve) => { resolverPrimerFrameAudioPuente = resolve; });
                return etapa('microfono', espera, timeoutMs).then(() => destino.stream);
            }

            // Vista previa: cámara y micrófono se abren en cuanto Kotlin concede permisos, mucho
            // antes de que exista una conversación de apiRTC (puede que ni siquiera haya médico
            // todavía). Se muestran en #local para que el paciente se vea mientras espera, y start()
            // los reutiliza en vez de volver a pedirlos si siguen vivos (ver streamVivo).
            let previewVideo = null;
            let previewAudio = null;

            function streamVivo(stream, kind) {
                if (!stream) return false;
                const tracks = kind === 'video' ? stream.getVideoTracks() : stream.getAudioTracks();
                return tracks.length > 0 && tracks.some((t) => t.readyState === 'live');
            }

            // Diagnóstico: qué micrófonos ve Chromium en este equipo. Los labels solo vienen llenos
            // una vez que ya se concedió permiso y se abrió al menos un dispositivo de ese tipo, así
            // que se llama después de abrir el micrófono, no antes.
            async function logDispositivosAudio() {
                try {
                    const dispositivos = (await navigator.mediaDevices.enumerateDevices())
                        .filter((d) => d.kind === 'audioinput')
                        .map((d) => ({ deviceId: d.deviceId, label: d.label || '(sin nombre)' }));
                    emit('audioDevices', { dispositivos });
                } catch (err) {
                    emit('audioDevices', Object.assign({ dispositivos: [] }, describirError(err)));
                }
            }

            // puenteNativo = true cuando Kotlin detectó un equipo/WebView limitado (ver
            // camaraQueRequierePuente en TelemedicineActivity): activa tanto el puente de cámara
            // como el de micrófono, evitando getUserMedia por completo para ambos.
            async function prepararPreview(puenteNativo) {
                try {
                    previewVideo = puenteNativo
                        ? await abrirCamaraPuente(640, 480, 20000)
                        : await abrirMedio('camara', 'video', { width: { ideal: 1280 }, height: { ideal: 720 } }, 45000);
                    document.getElementById('local').srcObject = previewVideo;
                    previewAudio = puenteNativo
                        ? await abrirMicrofonoPuente(20000)
                        : await abrirMedio('microfono', 'audio', true, 20000);
                    if (!puenteNativo) logDispositivosAudio();
                    emit('previewListo', {});
                } catch (err) {
                    emit('previewError', describirError(err));
                }
            }

            async function obtenerVideoParaLlamada(puenteNativo) {
                if (streamVivo(previewVideo, 'video')) return previewVideo;
                return puenteNativo
                    ? await abrirCamaraPuente(640, 480, 20000)
                    : await abrirMedio('camara', 'video', { width: { ideal: 1280 }, height: { ideal: 720 } }, 45000);
            }

            async function obtenerAudioParaLlamada(puenteNativo) {
                if (streamVivo(previewAudio, 'audio')) return previewAudio;
                return puenteNativo
                    ? await abrirMicrofonoPuente(20000)
                    : await abrirMedio('microfono', 'audio', true, 20000);
            }

            // Cada etapa avisa a Kotlin al terminar y falla con su nombre si se queda colgada, para
            // saber dónde se atora la conexión (registro, cámara, micrófono, stream, join o publish).
            function etapa(nombre, promesa, ms) {
                return new Promise((resolve, reject) => {
                    const t = setTimeout(
                        () => reject(new Error('Tiempo agotado en la etapa "' + nombre + '"')), ms || 12000);
                    Promise.resolve(promesa).then(
                        (valor) => { clearTimeout(t); emit('etapa', { nombre }); resolve(valor); },
                        (err) => { clearTimeout(t); reject(err); }
                    );
                });
            }

            // Limpiar al cargar la página ids de dispositivos guardados de sesiones previas
            try {
                localStorage.removeItem('mosi_camara_id');
                localStorage.removeItem('mosi_microfono_id');
            } catch (e) { }

            /*
             * Cámara y micrófono se buscan y se abren por separado con resguardo para HAL Legacy.
             * Primero se intenta con la configuración ideal (ej. 1280x720) con un tiempo límite corto (7 s).
             * Si la cámara/controlador del equipo (HAL Legacy / RK3288) no la acepta o se atora, se pasa
             * inmediatamente al modo directo con restricciones simples ({ video: true }), el cual abre la
             * cámara con la resolución por defecto del hardware sin quedarse colgado.
             */
            async function abrirMedio(tipo, kind, constraintsBase, timeoutMs) {
                const avisoTrack = setInterval(() => {
                    console.log('🎥 Esperando a que abra ' + tipo + '…');
                }, 3000);

                async function pedirStream(constraints, ms) {
                    return etapa(tipo, navigator.mediaDevices.getUserMedia(constraints), ms);
                }

                try {
                    // Intento 1: con restricciones ideales (ej. 1280x720) con tiempo de espera corto
                    if (constraintsBase && typeof constraintsBase === 'object') {
                        const c1 = { audio: false, video: false };
                        c1[kind] = constraintsBase;
                        try {
                            return await pedirStream(c1, 7000);
                        } catch (err1) {
                            console.warn('🎥 Intento ideal para ' + tipo + ' no respondió o falló (' + String((err1 && err1.message) || err1) + '). Probando modo directo...');
                        }
                    }

                    // Intento 2: restricciones simples ({ video: true } o { audio: true }) para compatibilidad con HAL Legacy
                    const c2 = { audio: false, video: false };
                    c2[kind] = true;
                    return await pedirStream(c2, Math.max(10000, timeoutMs - 7000));
                } finally {
                    clearInterval(avisoTrack);
                }
            }

            // auth = { id, token } solo si la app de apiRTC usa autenticación con token JSON
            // puenteNativo = true cuando Kotlin detectó un equipo/WebView limitado (ver
            // camaraQueRequierePuente en TelemedicineActivity): la cámara y el micrófono ya se
            // están capturando nativamente y empujando frames por pushFrame()/pushAudioFrame() en
            // vez de que esta función se los pida al WebView.
            async function start(apiKey, codigo, auth, puenteNativo) {
                let session;
                try {
                    userAgent = new apiRTC.UserAgent({ uri: apiKey });
                    const registro = { cloudUrl: 'https://cloud.apirtc.com' };
                    if (auth && auth.token) {
                        registro.id = auth.id;
                        registro.token = auth.token;
                    }
                    session = await etapa('registro', userAgent.register(registro));
                } catch (err) {
                    emit('error', Object.assign({ etapa: 'registro' }, describirError(err)));
                    return;
                }

                try {

                    conversation = session.getOrCreateConversation(codigo);

                    conversation.on('streamListChanged', (info) => {
                        if (info.listEventType === 'added' && info.isRemote === true) {
                            conversation.subscribeToMedia(info.streamId)
                                .catch((err) => emit('warning', Object.assign({ etapa: 'subscribe' }, describirError(err))));
                        }
                    });

                    conversation.on('streamAdded', (stream) => {
                        stream.addInDiv('remote', 'remote-media-' + stream.streamId, {}, false);
                        emit('remoteAdded', { streamId: stream.streamId });
                    });

                    conversation.on('streamRemoved', (stream) => {
                        stream.removeFromDiv('remote', 'remote-media-' + stream.streamId);
                        emit('remoteRemoved', {
                            streamId: stream.streamId,
                            restantes: document.getElementById('remote').children.length
                        });
                    });

                    // Cámara y micrófono ya deberían estar abiertos desde prepararPreview() (Kotlin la
                    // dispara apenas concede permisos, mucho antes de llegar aquí); si siguen vivos se
                    // reutilizan tal cual, sin volver a pedirlos. Si no (falló la vista previa, o esta
                    // llamada es un reintento tras colgar), se abren aquí igual que antes.
                    const streamVideo = await obtenerVideoParaLlamada(puenteNativo);
                    const streamAudio = await obtenerAudioParaLlamada(puenteNativo);

                    // Con la cámara ya abierta, enumerateDevices sí devuelve las demás cámaras con sus
                    // ids. Solo sirve para el botón de cambiar cámara, así que si falla no detiene la
                    // llamada. Con puente de cámara externa no aplica: cambiar de cámara requeriría
                    // reabrir el puente nativo con otro id, no está soportado por ahora.
                    if (puenteNativo) {
                        camaras = [];
                    } else {
                        try {
                            camaras = (await etapa('enumerar', navigator.mediaDevices.enumerateDevices(), 4000))
                                .filter((d) => d.kind === 'videoinput');
                        } catch (e) {
                            camaras = [];
                        }
                    }

                    // Se unen en un solo MediaStream y se entrega ya abierto a apiRTC (createStreamFromMediaStream),
                    // en vez de que sea apiRTC quien pida la cámara/el micrófono por su cuenta.
                    const combinado = new MediaStream([...streamVideo.getVideoTracks(), ...streamAudio.getAudioTracks()]);
                    localStream = await etapa('stream-local', userAgent.createStreamFromMediaStream(combinado), 10000);
                    localStream.attachToElement(document.getElementById('local'));

                    await etapa('join', conversation.join());
                    await etapa('publish', conversation.publish(localStream));
                    emit('joined', { camaras: camaras.length });
                } catch (err) {
                    emit('error', Object.assign({ etapa: 'start' }, describirError(err)));
                }
            }

            async function switchCamera() {
                if (!conversation || camaras.length < 2) return;

                indiceCamara = (indiceCamara + 1) % camaras.length;
                try {
                    conversation.unpublish(localStream);
                    localStream.release();

                    localStream = await userAgent.createStream({
                        constraints: {
                            audio: true,
                            video: { deviceId: { exact: camaras[indiceCamara].deviceId } }
                        }
                    });
                    localStream.attachToElement(document.getElementById('local'));
                    await conversation.publish(localStream);
                } catch (err) {
                    emit('warning', Object.assign({ etapa: 'switchCamera' }, describirError(err)));
                }
            }

            async function hangup() {
                try {
                    if (conversation) {
                        await conversation.leave();
                        conversation.destroy();
                    }
                } catch (err) {
                    emit('warning', Object.assign({ etapa: 'hangup' }, describirError(err)));
                } finally {
                    try { if (localStream) localStream.release(); } catch (e) { }
                    try { if (userAgent) Promise.resolve(userAgent.unregister()).catch(() => { }); } catch (e) { }
                    conversation = null;
                    localStream = null;
                    userAgent = null;
                    indiceCamara = 0;
                    // Deja de dibujar frames del puente si Kotlin manda alguno tardío tras colgar
                    canvasPuente = null;
                    ctxPuente = null;
                    huboFramePuente = false;
                    resolverPrimerFramePuente = null;
                    // Ídem para el puente de audio: se cierra el contexto (AudioRecord nativo sigue
                    // corriendo del lado de Kotlin) y se descarta la cola pendiente.
                    try { if (audioCtxPuente) audioCtxPuente.close().catch(() => { }); } catch (e) { }
                    audioCtxPuente = null;
                    audioQueuePuente = [];
                    huboFrameAudioPuente = false;
                    resolverPrimerFrameAudioPuente = null;
                    // Sin esto, al reconectar quedaría el video remoto de la sesión anterior
                    document.getElementById('remote').innerHTML = '';
                    emit('left', {});
                }
            }

            return { start, switchCamera, hangup, pushFrame, pushAudioFrame, prepararPreview };
        })();

        /*
         * Respaldo WebRTC (rol paciente). Réplica de telemedicina_v2/js/fallbackWebRTC-paciente.js:
         * el paciente es quien crea la oferta y el médico responde; la señalización va por
         * socket.io. La sala y el JWT los resuelve Kotlin (el servidor entrega las credenciales).
         * apiRTC no se toca: sigue de fondo, igual que en la web.
         */
        const MosiFallback = (() => {
            let socket = null;
            let pc = null;
            let stream = null;
            let callId = '';
            let terminado = false;

            function userIdDeJwt(jwt) {
                try {
                    const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                    const sub = JSON.parse(atob(b64)).sub;
                    if (sub !== undefined && sub !== null) return String(sub);
                } catch (e) { }
                return '2';
            }

            function senal(payload) {
                if (socket) socket.emit('signal', { callId, payload });
            }

            async function start(config) {
                stop(false);
                terminado = false;
                callId = String(config.roomId);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 24 } },
                        audio: true
                    });
                    document.getElementById('fb-local').srcObject = stream;

                    pc = new RTCPeerConnection({ iceServers: config.iceServers });
                    stream.getTracks().forEach((t) => pc.addTrack(t, stream));

                    const remoto = new MediaStream();
                    const rv = document.getElementById('fb-remote');
                    rv.srcObject = remoto;
                    pc.ontrack = (evt) => {
                        remoto.addTrack(evt.track);
                        rv.play().catch(() => { });
                    };
                    pc.onicecandidate = (evt) => {
                        if (evt.candidate) senal({ candidate: evt.candidate });
                    };
                    pc.onconnectionstatechange = () => {
                        emit('fallback', { estado: pc ? pc.connectionState : 'closed' });
                        if (pc && pc.connectionState === 'failed') {
                            emit('error', { etapa: 'fallback', nombre: '', mensaje: 'La conexión de respaldo falló' });
                        }
                    };

                    socket = io(config.socketUrl, {
                        path: '/socket.io',
                        transports: ['websocket'],
                        auth: { token: config.jwt }
                    });
                    socket.on('connect', () => {
                        socket.emit('join-call', { callId, userId: userIdDeJwt(config.jwt) }, () => { });
                        emit('fallback', { estado: 'sala' });
                    });
                    socket.on('connect_error', (err) => {
                        emit('error', Object.assign({ etapa: 'fallback' }, describirError(err)));
                    });
                    socket.on('signal', async (msg) => {
                        const p = msg && msg.payload;
                        if (!p || !pc) return;
                        try {
                            if (p.join) {
                                const oferta = await pc.createOffer();
                                await pc.setLocalDescription(oferta);
                                senal({ offer: pc.localDescription });
                            } else if (p.answer) {
                                await pc.setRemoteDescription(p.answer);
                            } else if (p.candidate) {
                                await pc.addIceCandidate(p.candidate);
                            }
                        } catch (err) {
                            emit('warning', Object.assign({ etapa: 'fallback-signal' }, describirError(err)));
                        }
                    });
                    // Si el médico se va del respaldo, la web del paciente termina todo
                    socket.on('leave-call', () => stop(true));

                    document.getElementById('fallback').classList.add('activo');
                } catch (err) {
                    emit('error', Object.assign({ etapa: 'fallback' }, describirError(err)));
                }
            }

            function stop(avisar) {
                const habiaSesion = !!(socket || pc || stream);
                try { if (socket) socket.disconnect(); } catch (e) { }
                try { if (pc) pc.close(); } catch (e) { }
                try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch (e) { }
                socket = null;
                pc = null;
                stream = null;
                document.getElementById('fallback').classList.remove('activo');
                document.getElementById('fb-remote').srcObject = null;
                document.getElementById('fb-local').srcObject = null;
                if (avisar && habiaSesion && !terminado) {
                    terminado = true;
                    emit('fallback', { estado: 'terminado' });
                }
            }

            return { start, stop: () => stop(false), finalizar: () => stop(true) };
        })();

        window.addEventListener('load', () => {
            // "ready" se avisa cuando terminó de cargar el SDK (con éxito o no)
            Promise.resolve(window.__sdkListo).then(() => {
                emit('ready', {
                    sdk: typeof apiRTC !== 'undefined',
                    chrome: window.__chromeVersion,
                    compat: window.__modoCompat,
                    errorSdk: window.__errorSdk
                });
            });
        });
    </script>
</body>
</html>
