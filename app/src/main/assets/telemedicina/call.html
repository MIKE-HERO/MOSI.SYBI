<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videollamada MOSI</title>
    <!--
        Motor de video de la consulta de telemedicina.
        Solo maneja audio/video con apiRTC; toda la interfaz y el flujo con el servidor
        viven en TelemedicineActivity. Se comunica con Kotlin a través de window.MosiBridge.
    -->
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #remote {
            position: absolute;
            inset: 0;
        }

        #remote video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #local {
            position: absolute;
            top: 80px;
            right: 16px;
            width: 22%;
            max-width: 320px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            background: #222;
            transform: scaleX(-1);
        }

        /* Respaldo WebRTC: se muestra encima del video de apiRTC, que sigue de fondo */
        #fallback {
            position: absolute;
            inset: 0;
            display: none;
            background: #000;
        }

        #fallback.activo {
            display: block;
        }

        #fb-remote {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #fb-local {
            position: absolute;
            top: 80px;
            right: 16px;
            width: 22%;
            max-width: 320px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            background: #222;
            transform: scaleX(-1);
        }
    </style>
    <script>
        // Si el SDK de apiRTC ni siquiera se puede interpretar (WebView viejo) queda aquí el motivo
        window.__errorSdk = '';
        window.addEventListener('error', (e) => {
            if (e.filename && e.filename.indexOf('apiRTC') >= 0) window.__errorSdk = String(e.message || '');
        });

        function emit(tipo, datos) {
            try {
                window.MosiBridge.onEvent(tipo, JSON.stringify(datos || {}));
            } catch (e) {
                console.error('MosiBridge no disponible', e);
            }
        }

        // apiRTC a veces rechaza con objetos ({ error: Error }, { message }, ...) en lugar de Error
        function describirError(err) {
            let actual = err;
            while (actual && typeof actual === 'object' && !(actual instanceof Error) && actual.error) {
                actual = actual.error;
            }
            let mensaje = actual && (actual.message || actual.reason);
            if (!mensaje) {
                try {
                    mensaje = typeof actual === 'string' ? actual : JSON.stringify(actual);
                } catch (e) {
                    mensaje = String(actual);
                }
            }
            return {
                nombre: (actual && actual.name) || '',
                mensaje: String(mensaje)
            };
        }
    </script>
    <script>
        /*
         * SDK de apiRTC. La versión actual usa sintaxis moderna de JavaScript (p. ej. "?.") que un
         * WebView anterior a Chrome 80 no puede interpretar. En esos equipos se carga una copia del
         * mismo SDK convertida para navegadores viejos (compat/) junto con polyfills, así la app no
         * depende de que cada equipo tenga el WebView actualizado. En WebViews modernos se usa el
         * SDK oficial de la CDN, igual que la web.
         */
        window.__chromeVersion = parseInt((navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1], 10) || 0;
        window.__modoCompat = window.__chromeVersion > 0 && window.__chromeVersion < 80;

        function cargarScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('No se pudo cargar ' + src));
                document.head.appendChild(s);
            });
        }

        window.__sdkListo = (window.__modoCompat
            ? cargarScript('compat/corejs.min.js').then(() => cargarScript('compat/apiRTC-compat.min.js'))
            : cargarScript('https://cdn.apirtc.com/apiRTC/apiRTC-latest.min.js'))
            .catch((err) => emit('error', { etapa: 'sdk', mensaje: String(err.message || err) }));
    </script>
</head>
<body>
    <div id="remote"></div>
    <video id="local" autoplay muted playsinline></video>
    <div id="fallback">
        <video id="fb-remote" autoplay playsinline></video>
        <video id="fb-local" autoplay muted playsinline></video>
    </div>
    <script src="socket.io.min.js"></script>

    <script>
        const MosiCall = (() => {
            let userAgent = null;
            let conversation = null;
            let localStream = null;
            let camaras = [];
            let indiceCamara = 0;

            // Cada etapa avisa a Kotlin al terminar y falla con su nombre si se queda colgada, para
            // saber dónde se atora la conexión (registro, cámara, micrófono, stream, join o publish).
            function etapa(nombre, promesa, ms) {
                return new Promise((resolve, reject) => {
                    const t = setTimeout(
                        () => reject(new Error('Tiempo agotado en la etapa "' + nombre + '"')), ms || 12000);
                    Promise.resolve(promesa).then(
                        (valor) => { clearTimeout(t); emit('etapa', { nombre }); resolve(valor); },
                        (err) => { clearTimeout(t); reject(err); }
                    );
                });
            }

            /*
             * Cámara y micrófono se buscan y se abren por separado, cada uno con su propio margen de
             * tiempo, en vez de pedirle a apiRTC un único getUserMedia combinado de audio+video. En
             * equipos con cámara "legacy" (HAL antigua) esto da dos ventajas:
             *   - Diagnóstico más fino: se sabe si lo que se atora es la cámara, el micrófono o ninguno.
             *   - Una vez que un dispositivo abre bien, se guarda su deviceId (localStorage) y la próxima
             *     vez se le pide a Chromium ESE dispositivo concreto en vez de dejar que vuelva a
             *     negociar "el mejor disponible" desde cero, que es la parte que parece colgarse.
             * Si el dispositivo guardado ya no existe o fallara, se descarta la marca y se vuelve al modo
             * automático (sin deviceId) para no quedar pegado a un id viejo/desconectado.
             */
            async function abrirMedio(tipo, kind, constraintsBase, timeoutMs) {
                const clave = 'mosi_' + tipo + '_id';
                const guardado = localStorage.getItem(clave);
                const avisoTrack = setInterval(() => {
                    console.log('🎥 Esperando a que abra ' + tipo + '…');
                }, 3000);
                async function intentar(deviceId) {
                    const constraints = { audio: false, video: false };
                    constraints[kind] = deviceId
                        ? Object.assign({}, constraintsBase, { deviceId: { exact: deviceId } })
                        : constraintsBase;
                    return etapa(tipo, navigator.mediaDevices.getUserMedia(constraints), timeoutMs);
                }
                try {
                    if (guardado) {
                        try {
                            return await intentar(guardado);
                        } catch (err) {
                            console.warn('🎥 ' + tipo + ' guardado (' + guardado + ') ya no sirvió, se descarta: ' + String((err && err.message) || err));
                            localStorage.removeItem(clave);
                        }
                    }
                    const stream = await intentar(null);
                    // Se guarda el dispositivo que de verdad abrió, para la próxima vez
                    const track = kind === 'video' ? stream.getVideoTracks()[0] : stream.getAudioTracks()[0];
                    const idAbierto = track && track.getSettings && track.getSettings().deviceId;
                    if (idAbierto) localStorage.setItem(clave, idAbierto);
                    return stream;
                } finally {
                    clearInterval(avisoTrack);
                }
            }

            // auth = { id, token } solo si la app de apiRTC usa autenticación con token JSON
            async function start(apiKey, codigo, auth) {
                let session;
                try {
                    userAgent = new apiRTC.UserAgent({ uri: apiKey });
                    const registro = { cloudUrl: 'https://cloud.apirtc.com' };
                    if (auth && auth.token) {
                        registro.id = auth.id;
                        registro.token = auth.token;
                    }
                    session = await etapa('registro', userAgent.register(registro));
                } catch (err) {
                    emit('error', Object.assign({ etapa: 'registro' }, describirError(err)));
                    return;
                }

                try {

                    conversation = session.getOrCreateConversation(codigo);

                    conversation.on('streamListChanged', (info) => {
                        if (info.listEventType === 'added' && info.isRemote === true) {
                            conversation.subscribeToMedia(info.streamId)
                                .catch((err) => emit('warning', Object.assign({ etapa: 'subscribe' }, describirError(err))));
                        }
                    });

                    conversation.on('streamAdded', (stream) => {
                        stream.addInDiv('remote', 'remote-media-' + stream.streamId, {}, false);
                        emit('remoteAdded', { streamId: stream.streamId });
                    });

                    conversation.on('streamRemoved', (stream) => {
                        stream.removeFromDiv('remote', 'remote-media-' + stream.streamId);
                        emit('remoteRemoved', {
                            streamId: stream.streamId,
                            restantes: document.getElementById('remote').children.length
                        });
                    });

                    // Cámara y micrófono se buscan/abren por separado (ver abrirMedio) en vez de un único
                    // getUserMedia combinado; en equipos con cámara "legacy" (HAL antigua) esa apertura
                    // combinada podía tardar mucho más de lo normal sin llegar a fallar ni a avisar.
                    const streamVideo = await abrirMedio(
                        'camara', 'video', { width: { ideal: 1280 }, height: { ideal: 720 } }, 45000
                    );
                    const streamAudio = await abrirMedio('microfono', 'audio', true, 20000);

                    // Con la cámara ya abierta, enumerateDevices sí devuelve las demás cámaras con sus
                    // ids. Solo sirve para el botón de cambiar cámara, así que si falla no detiene la llamada.
                    try {
                        camaras = (await etapa('enumerar', navigator.mediaDevices.enumerateDevices(), 4000))
                            .filter((d) => d.kind === 'videoinput');
                    } catch (e) {
                        camaras = [];
                    }

                    // Se unen en un solo MediaStream y se entrega ya abierto a apiRTC (createStreamFromMediaStream),
                    // en vez de que sea apiRTC quien pida la cámara/el micrófono por su cuenta.
                    const combinado = new MediaStream([...streamVideo.getVideoTracks(), ...streamAudio.getAudioTracks()]);
                    localStream = await etapa('stream-local', userAgent.createStreamFromMediaStream(combinado), 10000);
                    localStream.attachToElement(document.getElementById('local'));

                    await etapa('join', conversation.join());
                    await etapa('publish', conversation.publish(localStream));
                    emit('joined', { camaras: camaras.length });
                } catch (err) {
                    emit('error', Object.assign({ etapa: 'start' }, describirError(err)));
                }
            }

            async function switchCamera() {
                if (!conversation || camaras.length < 2) return;

                indiceCamara = (indiceCamara + 1) % camaras.length;
                try {
                    conversation.unpublish(localStream);
                    localStream.release();

                    localStream = await userAgent.createStream({
                        constraints: {
                            audio: true,
                            video: { deviceId: { exact: camaras[indiceCamara].deviceId } }
                        }
                    });
                    localStream.attachToElement(document.getElementById('local'));
                    await conversation.publish(localStream);
                } catch (err) {
                    emit('warning', Object.assign({ etapa: 'switchCamera' }, describirError(err)));
                }
            }

            async function hangup() {
                try {
                    if (conversation) {
                        await conversation.leave();
                        conversation.destroy();
                    }
                } catch (err) {
                    emit('warning', Object.assign({ etapa: 'hangup' }, describirError(err)));
                } finally {
                    try { if (localStream) localStream.release(); } catch (e) { }
                    try { if (userAgent) Promise.resolve(userAgent.unregister()).catch(() => { }); } catch (e) { }
                    conversation = null;
                    localStream = null;
                    userAgent = null;
                    indiceCamara = 0;
                    // Sin esto, al reconectar quedaría el video remoto de la sesión anterior
                    document.getElementById('remote').innerHTML = '';
                    emit('left', {});
                }
            }

            return { start, switchCamera, hangup };
        })();

        /*
         * Respaldo WebRTC (rol paciente). Réplica de telemedicina_v2/js/fallbackWebRTC-paciente.js:
         * el paciente es quien crea la oferta y el médico responde; la señalización va por
         * socket.io. La sala y el JWT los resuelve Kotlin (el servidor entrega las credenciales).
         * apiRTC no se toca: sigue de fondo, igual que en la web.
         */
        const MosiFallback = (() => {
            let socket = null;
            let pc = null;
            let stream = null;
            let callId = '';
            let terminado = false;

            function userIdDeJwt(jwt) {
                try {
                    const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                    const sub = JSON.parse(atob(b64)).sub;
                    if (sub !== undefined && sub !== null) return String(sub);
                } catch (e) { }
                return '2';
            }

            function senal(payload) {
                if (socket) socket.emit('signal', { callId, payload });
            }

            async function start(config) {
                stop(false);
                terminado = false;
                callId = String(config.roomId);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 24 } },
                        audio: true
                    });
                    document.getElementById('fb-local').srcObject = stream;

                    pc = new RTCPeerConnection({ iceServers: config.iceServers });
                    stream.getTracks().forEach((t) => pc.addTrack(t, stream));

                    const remoto = new MediaStream();
                    const rv = document.getElementById('fb-remote');
                    rv.srcObject = remoto;
                    pc.ontrack = (evt) => {
                        remoto.addTrack(evt.track);
                        rv.play().catch(() => { });
                    };
                    pc.onicecandidate = (evt) => {
                        if (evt.candidate) senal({ candidate: evt.candidate });
                    };
                    pc.onconnectionstatechange = () => {
                        emit('fallback', { estado: pc ? pc.connectionState : 'closed' });
                        if (pc && pc.connectionState === 'failed') {
                            emit('error', { etapa: 'fallback', nombre: '', mensaje: 'La conexión de respaldo falló' });
                        }
                    };

                    socket = io(config.socketUrl, {
                        path: '/socket.io',
                        transports: ['websocket'],
                        auth: { token: config.jwt }
                    });
                    socket.on('connect', () => {
                        socket.emit('join-call', { callId, userId: userIdDeJwt(config.jwt) }, () => { });
                        emit('fallback', { estado: 'sala' });
                    });
                    socket.on('connect_error', (err) => {
                        emit('error', Object.assign({ etapa: 'fallback' }, describirError(err)));
                    });
                    socket.on('signal', async (msg) => {
                        const p = msg && msg.payload;
                        if (!p || !pc) return;
                        try {
                            if (p.join) {
                                const oferta = await pc.createOffer();
                                await pc.setLocalDescription(oferta);
                                senal({ offer: pc.localDescription });
                            } else if (p.answer) {
                                await pc.setRemoteDescription(p.answer);
                            } else if (p.candidate) {
                                await pc.addIceCandidate(p.candidate);
                            }
                        } catch (err) {
                            emit('warning', Object.assign({ etapa: 'fallback-signal' }, describirError(err)));
                        }
                    });
                    // Si el médico se va del respaldo, la web del paciente termina todo
                    socket.on('leave-call', () => stop(true));

                    document.getElementById('fallback').classList.add('activo');
                } catch (err) {
                    emit('error', Object.assign({ etapa: 'fallback' }, describirError(err)));
                }
            }

            function stop(avisar) {
                const habiaSesion = !!(socket || pc || stream);
                try { if (socket) socket.disconnect(); } catch (e) { }
                try { if (pc) pc.close(); } catch (e) { }
                try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch (e) { }
                socket = null;
                pc = null;
                stream = null;
                document.getElementById('fallback').classList.remove('activo');
                document.getElementById('fb-remote').srcObject = null;
                document.getElementById('fb-local').srcObject = null;
                if (avisar && habiaSesion && !terminado) {
                    terminado = true;
                    emit('fallback', { estado: 'terminado' });
                }
            }

            return { start, stop: () => stop(false), finalizar: () => stop(true) };
        })();

        window.addEventListener('load', () => {
            // "ready" se avisa cuando terminó de cargar el SDK (con éxito o no)
            Promise.resolve(window.__sdkListo).then(() => {
                emit('ready', {
                    sdk: typeof apiRTC !== 'undefined',
                    chrome: window.__chromeVersion,
                    compat: window.__modoCompat,
                    errorSdk: window.__errorSdk
                });
            });
        });
    </script>
</body>
</html>
